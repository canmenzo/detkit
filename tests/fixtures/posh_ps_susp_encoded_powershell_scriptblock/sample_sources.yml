# Pinned public EVTX samples for this rule's tests.
# Samples are fetched at test time (not vendored) — see docs/adr/0002.
# Each is pinned to an immutable commit + sha256 for reproducibility.
samples:
  - name: true_positive
    expect: fire          # Invoke-Obfuscation "encoding" menu output (EID 4104)
    repo: Yamato-Security/hayabusa-sample-evtx
    commit: 0845333ecb4afcf64c55c6e10946383f168f308c
    path: DeepBlueCLI/Powershell-Invoke-Obfuscation-encoding-menu.evtx
    sha256: B1D7C3411053A4190C93657265679958228B4BDB97652984C1564A67FCFAB167

  - name: negative_no_scriptblock
    expect: silent        # 4688 process-exec sample: no ScriptBlockText -> must not fire
    repo: Yamato-Security/hayabusa-sample-evtx
    commit: 0845333ecb4afcf64c55c6e10946383f168f308c
    path: EVTX-to-MITRE-Attack/TA0002-Execution/T1059.001-PowerShell/ID4688-Encoded PowerShell MSF payload via process execution.evtx
    sha256: DC7340A1B68E172F39CE378044A304DF86539B43434D2CD6755F9CFDCE855479

# There is no benign 4104 baseline here, and there will not be one: nobody
# publishes a capture of ordinary PowerShell, because ordinary PowerShell is
# whatever a particular organisation happens to run. The benign side of this rule
# is measured in evals/ instead — where it scores an FP rate of 0.67, which is
# what demoted it to a hunting query. See ADR 0006.

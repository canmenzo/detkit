title: Credential Added to Entra ID Application by a Service Principal
id: 7b41e9d2-5c83-4a6f-9e12-8d3b7c4a2f56
status: experimental
description: >
  Detects a client secret or certificate being added to an Entra ID application
  or service principal where the actor performing the change is itself an
  application rather than a user. Adding credentials to an app registration is
  the standard cloud persistence move (T1098.001): the attacker keeps a valid
  credential that survives the victim's password reset and MFA enrolment, and it
  is invisible to any control that watches user sign-ins.

  Administrators add secrets legitimately and constantly, so the operation alone
  is not a detection — the benign half of this rule's eval set is exactly that.
  The discriminator is the initiating actor: an application granting itself or
  another application new credentials, which is what a consented malicious app or
  a stolen app token does, and which a human admin workflow does not.

  Known limit, measured rather than assumed: `InitiatedBy` is a dynamic JSON
  column and Sigma can only match it as text. Where a tenant serialises both the
  `user` and `app` branches on every record, a user-initiated change carrying an
  empty app branch matches too. That case is in this rule's eval set as a
  declared false positive; at scale the condition wants tightening to
  `tostring(InitiatedBy.app.appId) != ""` in the target platform's own syntax.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://learn.microsoft.com/entra/identity/monitoring-health/concept-audit-logs
  - https://learn.microsoft.com/azure/azure-monitor/reference/tables/auditlogs
author: Can Ozmen
date: 2026-08-20
modified: 2026-08-20
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName:
      - 'Add service principal credentials'
      - 'Update application - Certificates and secrets management'
      - 'Update application – Certificates and secrets management'
    Result: 'success'
  actor_is_an_application:
    InitiatedBy|contains: '"appId"'
  condition: selection and actor_is_an_application
falsepositives:
  - Automation that provisions app registrations with a service principal of its
    own — Terraform, Azure DevOps service connections, CI identities. Baseline
    the provisioning identity's object ID and exclude it explicitly.
  - Tenants whose audit pipeline serialises both initiator branches on every
    record. See the known limit in the description.
level: high

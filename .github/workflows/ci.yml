name: detection-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: "3.11"

jobs:
  python:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: astral-sh publishes no moving `v10` tag, and
      # pinning exactly is what the rest of this repo does anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: ruff
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy

  rules:
    name: rule discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: astral-sh publishes no moving `v10` tag, and
      # pinning exactly is what the rest of this repo does anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: yamllint rules
        run: uv run yamllint detections/
      - name: sigma check
        run: uv run sigma check --fail-on-issues -c sigma-validation.yml detections/
      - name: metadata + fixture + ATT&CK tag discipline
        run: uv run detkit validate

  convert:
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: astral-sh publishes no moving `v10` tag, and
      # pinning exactly is what the rest of this repo does anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: compile to Splunk + XDR, and check every query is bound
        # An unbound search runs against every index the user can read. Syntactic
        # validity is not deployability, and this is the difference. The check
        # lives in detkit rather than in shell so it is unit-tested — the first
        # version was line-based and misread a multi-line SPL query as unbound.
        run: uv run detkit convert

  test:
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: astral-sh publishes no moving `v10` tag, and
      # pinning exactly is what the rest of this repo does anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: cache pinned EVTX samples
        # Keyed on the manifests, so a re-pinned sample invalidates the cache and
        # an unchanged one stops hitting the network on every run.
        uses: actions/cache@v6
        with:
          path: tests/.sample_cache
          key: evtx-samples-${{ hashFiles('tests/fixtures/*/sample_sources.yml') }}
      - name: cache hayabusa release
        uses: actions/cache@v6
        with:
          path: hayabusa
          key: hayabusa-${{ hashFiles('.hayabusa-version') }}-linux
      - name: install hayabusa (pinned, checksum-verified)
        # Replaces a curl + unzip + `find` guess whose empty result used to
        # export a bogus path and degrade the whole suite to "skipped".
        run: uv run detkit hayabusa >> "$GITHUB_ENV"
      - name: pytest (unit + detection; fetches pinned samples, runs Hayabusa)
        # Refuse to pass on skipped detection tests. See tests/harness.py.
        env:
          DETKIT_REQUIRE_HAYABUSA: "1"
        run: uv run pytest -v

  eval:
    name: detection quality
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: astral-sh publishes no moving `v10` tag, and
      # pinning exactly is what the rest of this repo does anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: score every rule against its labelled events
        # Fails the build when a rule drops below the thresholds declared in its
        # own evals/<stem>/cases.yml. Results are published to the run summary so
        # every PR carries its detection-quality numbers.
        run: |
          set +e
          uv run detkit eval | tee eval-output.txt
          status="${PIPESTATUS[0]}"
          set -e
          {
            echo '## Detection quality'
            echo
            echo '```'
            cat eval-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  vendored:
    # Third-party SigmaHQ corpus: NOT held to the fixture gate (see vendored/README.md).
    # Proven at scale instead — every rule must batch-convert through the Splunk
    # backend, and all ATT&CK tags feed the coverage map.
    runs-on: ubuntu-latest
    needs: [python, rules]
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: astral-sh publishes no moving `v10` tag, and
      # pinning exactly is what the rest of this repo does anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: convert + coverage report over vendored corpus
        run: uv run detkit vendored

  coverage:
    runs-on: ubuntu-latest
    needs: [python, rules, convert, test, eval, vendored]
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact release: astral-sh publishes no moving `v10` tag, and
      # pinning exactly is what the rest of this repo does anyway.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: regenerate every published artifact
        run: |
          uv run detkit vendored
          uv run detkit eval
          uv run detkit navigator
          uv run detkit coverage
          uv run detkit dashboard
          uv run detkit readme
      - name: committed artifacts must match what the generators produce
        # Generator output is a pure function of the corpus (no timestamps), so a
        # diff here means someone changed rules without regenerating and the
        # published dashboard no longer reflects the repo. PNGs are excluded:
        # matplotlib output is not byte-stable across versions, and a stale PNG
        # cannot occur without these three also being stale.
        run: |
          git diff --exit-code -- \
            coverage/navigator_layer.json \
            vendored/report.json \
            evals/results.json \
            site/index.html \
            site/about.html \
            README.md \
          || { echo "::error::generated artifacts are stale — run the generators and commit"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/navigator_layer.json
            coverage/coverage.png
